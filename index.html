<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DÜNYA TV v0.7</title><style>body{background:#101827;color:white;font:15px system-ui;margin:12px}main{display:grid;grid-template-columns:minmax(105px,30%) 1fr;gap:12px}button,input{background:#243247;color:white;border:1px solid #40516a;border-radius:8px;padding:10px;max-width:100%;box-sizing:border-box}aside button{display:block;width:100%;text-align:left;margin:4px 0}video{width:100%;background:black;max-height:65vh}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}aside{max-height:80vh;overflow:auto}a{color:#9cd2ff}</style><h2>DÜNYA TV <small>v0.7 TEST</small></h2><main><aside><input id="search" placeholder="Kanal ara"><div id="list"></div></aside><section><h3 id="name">Kanal seçin</h3><video id="video" controls playsinline></video><p id="status">Hazır</p><button id="retry">Tekrar dene</button> <button id="copy">Hata raporunu kopyala</button><p><a id="official" hidden target="_blank" rel="noopener noreferrer">Resmî canlı yayını aç</a></p><pre id="report"></pre></section></main><script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script><script type="module">
import {playbackReport,explain} from './diagnostics.js';
const rows=[...["TRT 1|trt1","TRT 2|trt2","TRT Haber|trthaber","TRT Spor|trtspor1","TRT Spor Yıldız|trtspor2","TRT Çocuk|trtcocuk","TRT Belgesel|trtbelgesel","TRT Müzik|trtmuzik","TRT Türk|trtturk","TRT World|trtworld","TRT Avaz|trtavaz"].map(s=>{const [n,id]=s.split("|");return [n,[ "https://tv-"+id+".medya.trt.com.tr/master.m3u8","https://tv-"+id+".medya.trt.com.tr/master_720.m3u8"]]}),["Kanal D",["https://demiroren-live.daioncdn.net/kanald/kanald.m3u8"]],["ATV",["https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/atv/atv_1080p.m3u8","https://trkvz-live.daioncdn.net/atv/atv.m3u8"]],["A Spor",["https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/aspor/aspor.m3u8","https://trkvz-live.daioncdn.net/aspor/aspor.m3u8"]],["France 24",["https://live.france24.com/hls/live/2037218/F24_EN_HI_HLS/master_2300.m3u8"]]];
rows.push(...[["Show TV",["https://rmtftbjlne.turknet.ercdn.net/bpeytmnqyp/showtv/showtv_1080p.m3u8","https://ciner-live.daioncdn.net/showtv/showtv.m3u8"]],["Star TV",["https://dogus-live.daioncdn.net/startv/playlist.m3u8"]],["TV8",["https://rkhubpaomb.turknet.ercdn.net/fwjkgpasof/tv8/tv8_1080p.m3u8","https://tv8-live.daioncdn.net/tv8/tv8.m3u8"]],["Kanal 7",["https://kanal7-live.daioncdn.net/kanal7/kanal7_1080p.m3u8"]],["Beyaz TV",["https://beyaztv-live.daioncdn.net/beyaztv/beyaztv.m3u8"]],["360 TV",["https://turkmedya-live.ercdn.net/tv360/tv360.m3u8"]],["a2",["https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/a2tv/a2tv.m3u8"]],["teve2",["https://demiroren-live.daioncdn.net/teve2/teve2.m3u8"]],["A Haber",["https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/ahaber/ahaber.m3u8"]],["NTV",["https://dogus-live.daioncdn.net/ntv/playlist.m3u8"]],["CNN Türk",["https://live.duhnet.tv/S2/HLS_LIVE/cnnturknp/playlist.m3u8"]],["Habertürk",["https://rmtftbjlne.turknet.ercdn.net/bpeytmnqyp/haberturktv/haberturktv_1080p.m3u8"]],["Halk TV",["https://halktv-live.daioncdn.net/halktv/halktv.m3u8"]],["TGRT Haber",["https://canli.tgrthaber.com/tgrt.m3u8"]],["24 TV",["https://turkmedya-live.ercdn.net/tv24/tv24.m3u8"]],["TLC",["https://dogus-live.daioncdn.net/tlc/playlist.m3u8"]],["Kral TV",["https://dogus-live.daioncdn.net/kraltv/playlist.m3u8"]],["Altaş TV",["https://edge1.socialsmart.tv/altastv/bant1/playlist.m3u8"]],["Aksu TV",["https://live.artidijitalmedya.com/artidijital_aksutv/aksutv/playlist.m3u8"]],["DW",["https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8"]],["Al Jazeera",["https://live-hls-apps-aje-fa.getaj.net/AJE/index.m3u8"]]]);
const officialPages={"Kanal D":"https://www.kanald.com.tr/canli-yayin","ATV":"https://www.atv.com.tr/canli-yayin"};const $=id=>document.getElementById(id),v=$("video"),states={};let selected=null,h=null,t=null,seq=0,attempts=[];
function draw(){ $("list").replaceChildren();rows.filter(r=>r[0].toLocaleLowerCase("tr").includes($("search").value.toLocaleLowerCase("tr"))).forEach(r=>{const b=document.createElement("button");b.textContent=(states[r[0]]||"⚪")+" "+r[0];b.onclick=()=>select(r);$("list").append(b)})}
function clean(){clearTimeout(t);v.onplaying=null;v.onerror=null;if(h){h.destroy();h=null}v.pause();v.removeAttribute("src");v.load()}
function select(r){$("copy").textContent="Hata raporunu kopyala";$("official").hidden=!officialPages[r[0]];if(officialPages[r[0]])$("official").href=officialPages[r[0]];selected=[r[0],[...r[1]].sort((a,b)=>Number(b===localStorage.getItem("last:"+r[0]))-Number(a===localStorage.getItem("last:"+r[0])))];attempts=[];$("name").textContent=r[0];$("report").textContent="";start(0)}
function start(i){const token=++seq;clean();const [n,urls]=selected;if(i>=urls.length){states[n]="🔴";$("status").textContent="Tüm kaynaklar başarısız. Varsa resmî yayın bağlantısını kullanın.";draw();return}const source=urls[i];states[n]="🟡";draw();$("status").textContent="Bağlanıyor · "+(i+1)+"/"+urls.length;
function fail(a){if(token!==seq)return;++seq;attempts.push({source,...a});$("report").textContent=playbackReport(n,attempts);$("status").textContent=explain(a);start(i+1)}
v.onplaying=()=>{if(token!==seq)return;clearTimeout(t);localStorage.setItem("last:"+n,source);states[n]="🟢";$("status").textContent="Yayın açık";draw()};v.onerror=()=>fail({type:"mediaError",detail:"MediaError "+(v.error?.code||"")});t=setTimeout(()=>fail({detail:"timeout"}),8000);
function play(){v.play().catch(e=>{if(token!==seq)return;if(e.name==="NotAllowedError"){$("status").textContent="Oynat düğmesine basın";clearTimeout(t)}else if(e.name!=="AbortError")fail({detail:e.name})})}
if(window.Hls&&Hls.isSupported()){h=new Hls({manifestLoadPolicy:{default:{maxTimeToFirstByteMs:5000,maxLoadTimeMs:7000,timeoutRetry:{maxNumRetry:0,retryDelayMs:0,maxRetryDelayMs:0},errorRetry:{maxNumRetry:0,retryDelayMs:0,maxRetryDelayMs:0}}}});h.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)fail({type:d.type,detail:d.details,http:d.response?.code})});h.on(Hls.Events.MANIFEST_PARSED,play);h.loadSource(source);h.attachMedia(v)}else if(v.canPlayType("application/vnd.apple.mpegurl")){v.src=source;play()}else fail({detail:"HLS desteklenmiyor"})}
$("search").oninput=draw;$("retry").onclick=()=>{if(selected)select(selected)};$("copy").onclick=async()=>{if(!selected)return;try{await navigator.clipboard.writeText(playbackReport(selected[0],attempts));$("copy").textContent="Kopyalandı"}catch{$("report").textContent=playbackReport(selected[0],attempts)}};draw();
</script></html>
