<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DÜNYA TV v0.9</title><style>body{background:#101827;color:white;font:15px system-ui;margin:12px}main{display:grid;grid-template-columns:minmax(105px,30%) 1fr;gap:12px}button,input{background:#243247;color:white;border:1px solid #40516a;border-radius:8px;padding:10px;max-width:100%;box-sizing:border-box}aside button{display:block;width:100%;text-align:left;margin:4px 0}video{width:100%;background:black;max-height:65vh}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}aside{max-height:80vh;overflow:auto}a{color:#9cd2ff}</style><h2>DÜNYA TV <small>v0.9 TEST</small></h2><main><aside><input id="search" placeholder="Kanal ara"><p id="counts"></p><button id="scan">Tüm kanalları test et</button><div id="list"></div></aside><section><h3 id="name">Kanal seçin</h3><video id="video" controls playsinline></video><p id="status">Hazır</p><button id="retry">Tekrar dene</button> <button id="copy">Hata raporunu kopyala</button><p><a id="official" hidden target="_blank" rel="noopener noreferrer">Resmî canlı yayını aç</a></p><button id="all">Tüm hata raporlarını kopyala</button><pre id="report"></pre></section></main><script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script><script type="module">

rows.find(r=>r[0]==="NTV")[1].push("https://dogus-live.daioncdn.net/ntv/ntv.m3u8");rows.find(r=>r[0]==="Kanal 7")[1].push("https://live.kanal7.com/live/kanal7LiveDesktop/index.m3u8");const officialPages={"NTV":"https://www.ntv.com.tr","Star TV":"https://www.startv.com.tr","CNN Türk":"https://www.cnnturk.com","TLC":"https://www.tlctv.com.tr","TRT Haber":"https://www.trthaber.com","Show TV":"https://www.showtv.com.tr","teve2":"https://www.teve2.com.tr","Kral TV":"https://www.kralmuzik.com.tr","Kanal D":"https://www.kanald.com.tr/canli-yayin","ATV":"https://www.atv.com.tr/canli-yayin"};const $=id=>document.getElementById(id),v=$("video"),states={};let history={};try{history=JSON.parse(localStorage.getItem("tv-errors-v8")||"{}")}catch{};let scanning=false,scanIndex=0,advanceTimer=null;let selected=null,h=null,t=null,seq=0,attempts=[];
function draw(){ $("counts").textContent="🟢 "+Object.values(states).filter(s=>s==="🟢").length+" · 🔴 "+Object.values(states).filter(s=>s==="🔴").length+" / "+rows.length; $("list").replaceChildren();rows.filter(r=>r[0].toLocaleLowerCase("tr").includes($("search").value.toLocaleLowerCase("tr"))).forEach(r=>{const b=document.createElement("button");b.textContent=(states[r[0]]||"⚪")+" "+r[0];b.onclick=()=>{stopScan();select(r)};$("list").append(b)})}
function clean(){clearTimeout(t);v.onplaying=null;v.onerror=null;if(h){h.destroy();h=null}v.pause();v.removeAttribute("src");v.load()}
function stopScan(){scanning=false;clearTimeout(advanceTimer);$("scan").textContent="Tüm kanalları test et"} function nextScan(){if(!scanning)return;clearTimeout(advanceTimer);advanceTimer=setTimeout(()=>{if(++scanIndex<rows.length)select(rows[scanIndex]);else stopScan()},1000)} $("scan").onclick=()=>{if(scanning){stopScan();return}scanning=true;scanIndex=0;$("scan").textContent="Testi durdur";v.muted=true;select(rows[0])}; function select(r){$("copy").textContent="Hata raporunu kopyala";$("official").hidden=!officialPages[r[0]];if(officialPages[r[0]])$("official").href=officialPages[r[0]];selected=[r[0],[...r[1]].sort((a,b)=>Number(b===localStorage.getItem("last:"+r[0]))-Number(a===localStorage.getItem("last:"+r[0])))];attempts=[];$("name").textContent=r[0];$("report").textContent="";start(0)}
function start(i,slow=false){const token=++seq;clean();const [n,urls]=selected;if(i>=urls.length){states[n]="🔴";$("status").textContent="Tüm kaynaklar başarısız. Varsa resmî yayın bağlantısını kullanın.";draw();nextScan();return}const source=urls[i];states[n]="🟡";draw();$("status").textContent="Bağlanıyor · "+(i+1)+"/"+urls.length+(slow?" · ikinci deneme":"");
function fail(a){if(token!==seq)return;++seq;attempts.push({source,...a});history[n]={...JSON.parse(playbackReport(n,attempts)),resolved:false};try{localStorage.setItem("tv-errors-v8",JSON.stringify(history))}catch{};$("report").textContent=playbackReport(n,attempts);$("status").textContent=explain(a);if(!slow&&!a.http&&/timeout/i.test(a.detail||""))start(i,true);else start(i+1)}
v.onplaying=()=>{if(token!==seq)return;clearTimeout(t);localStorage.setItem("last:"+n,source);states[n]="🟢";if(history[n]){history[n].resolved=true;try{localStorage.setItem("tv-errors-v8",JSON.stringify(history))}catch{}};nextScan();$("status").textContent="Yayın açık";draw()};v.onerror=()=>fail({type:"mediaError",detail:"MediaError "+(v.error?.code||"")});t=setTimeout(()=>fail({detail:"timeout"}),slow?20000:8000);
function play(){v.play().catch(e=>{if(token!==seq)return;if(e.name==="NotAllowedError"){$("status").textContent="Oynat düğmesine basın";clearTimeout(t);if(scanning){states[n]="⚪";draw();nextScan()}}else if(e.name!=="AbortError")fail({detail:e.name})})}
if(window.Hls&&Hls.isSupported()){h=new Hls({manifestLoadPolicy:{default:{maxTimeToFirstByteMs:slow?15000:5000,maxLoadTimeMs:slow?18000:7000,timeoutRetry:{maxNumRetry:0,retryDelayMs:0,maxRetryDelayMs:0},errorRetry:{maxNumRetry:0,retryDelayMs:0,maxRetryDelayMs:0}}}});h.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal||[401,403,404].includes(d.response?.code))fail({type:d.type,detail:d.details,http:d.response?.code})});h.on(Hls.Events.MANIFEST_PARSED,play);h.loadSource(source);h.attachMedia(v)}else if(v.canPlayType("application/vnd.apple.mpegurl")){v.src=source;play()}else fail({detail:"HLS desteklenmiyor"})}
$("all").onclick=async()=>{const report=JSON.stringify(Object.values(history),null,2);try{await navigator.clipboard.writeText(report);$("all").textContent="Tüm raporlar kopyalandı"}catch{$("report").textContent=report}};$("search").oninput=draw;$("retry").onclick=()=>{stopScan();if(selected)select(selected)};$("copy").onclick=async()=>{if(!selected)return;try{await navigator.clipboard.writeText(playbackReport(selected[0],attempts));$("copy").textContent="Kopyalandı"}catch{$("report").textContent=playbackReport(selected[0],attempts)}};draw();
</script></html>
